<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ours" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="ext" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="bin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">miniRT Submodule Architecture</text>
  <text x="320" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">indigo = self-made / teal = external / green = binary</text>

  <!-- minilibx (external) -->
  <rect x="40" y="70" width="160" height="44" rx="8" fill="url(#ext)" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="120" y="89" text-anchor="middle" fill="#f0fdfa" font-weight="bold">minilibx-linux</text>
  <text x="120" y="104" text-anchor="middle" fill="#a7f3d0" font-size="11">X11 windowing (not ours)</text>

  <!-- libft -->
  <rect x="240" y="70" width="160" height="44" rx="8" fill="url(#ours)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="320" y="89" text-anchor="middle" fill="#eef2ff" font-weight="bold">libft</text>
  <text x="320" y="104" text-anchor="middle" fill="#c7d2fe" font-size="11">vectors, colors, matrices</text>

  <!-- mlx_wrapper -->
  <rect x="40" y="150" width="160" height="44" rx="8" fill="url(#ours)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="120" y="169" text-anchor="middle" fill="#eef2ff" font-weight="bold">mlx_wrapper</text>
  <text x="120" y="184" text-anchor="middle" fill="#c7d2fe" font-size="11">input, key/mouse hooks</text>

  <!-- font_renderer -->
  <rect x="240" y="150" width="160" height="44" rx="8" fill="url(#ours)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="320" y="169" text-anchor="middle" fill="#eef2ff" font-weight="bold">font_renderer</text>
  <text x="320" y="184" text-anchor="middle" fill="#c7d2fe" font-size="11">TTF parsing + rasterization</text>

  <!-- mlxui -->
  <rect x="140" y="230" width="160" height="44" rx="8" fill="url(#ours)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="220" y="249" text-anchor="middle" fill="#eef2ff" font-weight="bold">mlxui</text>
  <text x="220" y="264" text-anchor="middle" fill="#c7d2fe" font-size="11">GUI components, hierarchy</text>

  <!-- xcerrcal -->
  <rect x="440" y="70" width="160" height="44" rx="8" fill="url(#ours)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="520" y="89" text-anchor="middle" fill="#eef2ff" font-weight="bold">xcerrcal</text>
  <text x="520" y="104" text-anchor="middle" fill="#c7d2fe" font-size="11">error handling</text>

  <!-- MiniRT binary -->
  <rect x="190" y="340" width="260" height="48" rx="8" fill="url(#bin)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="320" y="362" text-anchor="middle" fill="#f0fdf4" font-weight="bold" font-size="14">miniRT binary</text>
  <text x="320" y="378" text-anchor="middle" fill="#bbf7d0" font-size="11">OpenCL ray tracing + UI + scene editor</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- minilibx -> mlx_wrapper -->
  <line x1="120" y1="114" x2="120" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- libft -> mlx_wrapper -->
  <line x1="280" y1="114" x2="160" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- minilibx -> font_renderer -->
  <line x1="160" y1="92" x2="280" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- mlx_wrapper -> font_renderer -->
  <line x1="160" y1="172" x2="280" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- font_renderer -> mlxui -->
  <line x1="300" y1="194" x2="240" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- mlx_wrapper -> mlxui -->
  <line x1="140" y1="194" x2="200" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- libft -> mlxui -->
  <line x1="340" y1="114" x2="240" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Everything -> binary -->
  <line x1="120" y1="194" x2="250" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="274" x2="320" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="114" x2="390" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="114" x2="350" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
