<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="aabb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="sphere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="obb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a1942"/>
      <stop offset="100%" stop-color="#7b2d8b"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="url(#bg)" rx="12"/>

  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">BVH Tree Structure (Arity=2)</text>
  <text x="400" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">indigo = AABB / green = Sphere / purple = OBB / teal = leaf (primitive)</text>

  <!-- Root Node - AABB -->
  <rect x="275" y="80" width="250" height="44" rx="8" fill="url(#aabb)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="400" y="99" text-anchor="middle" fill="#eef2ff" font-weight="bold">Root [AABB] SAH Split</text>
  <text x="400" y="114" text-anchor="middle" fill="#c7d2fe" font-size="11">9 objects along longest axis</text>

  <!-- Level 1 Children -->
  <rect x="80" y="170" width="180" height="44" rx="8" fill="url(#sphere)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="170" y="189" text-anchor="middle" fill="#f0fdfa" font-weight="bold">Left [Sphere] MedPrim</text>
  <text x="170" y="204" text-anchor="middle" fill="#bbf7d0" font-size="11">4 objects (median split)</text>

  <rect x="540" y="170" width="180" height="44" rx="8" fill="url(#obb)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="630" y="189" text-anchor="middle" fill="#faf5ff" font-weight="bold">Right [OBB] PCA</text>
  <text x="630" y="204" text-anchor="middle" fill="#e9d5ff" font-size="11">5 objects (tight fit)</text>

  <path d="M 310 124 C 310 147, 210 147, 210 170" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 490 124 C 490 147, 590 147, 590 170" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Level 2 - Leaves under Left -->
  <rect x="50" y="260" width="120" height="44" rx="8" fill="url(#leaf)" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="110" y="279" text-anchor="middle" fill="#f0fdfa" font-weight="bold">Leaf A (sp)</text>
  <text x="110" y="294" text-anchor="middle" fill="#a7f3d0" font-size="11">sphere #5</text>

  <rect x="190" y="260" width="120" height="44" rx="8" fill="url(#leaf)" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="250" y="279" text-anchor="middle" fill="#f0fdfa" font-weight="bold">Leaf B (tr)</text>
  <text x="250" y="294" text-anchor="middle" fill="#a7f3d0" font-size="11">triangle #12</text>

  <path d="M 140 214 C 140 237, 110 237, 110 260" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 200 214 C 200 237, 220 237, 220 260" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Level 2 - Split under Right -->
  <rect x="480" y="260" width="130" height="44" rx="8" fill="url(#aabb)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="545" y="279" text-anchor="middle" fill="#eef2ff" font-weight="bold">Inner [AABB]</text>
  <text x="545" y="294" text-anchor="middle" fill="#c7d2fe" font-size="11">sub-divided</text>

  <rect x="645" y="260" width="120" height="44" rx="8" fill="url(#leaf)" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="705" y="279" text-anchor="middle" fill="#f0fdfa" font-weight="bold">Leaf C (pl)</text>
  <text x="705" y="294" text-anchor="middle" fill="#a7f3d0" font-size="11">plane #3</text>

  <path d="M 560 214 C 560 237, 545 237, 545 260" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 680 214 C 680 237, 685 237, 685 260" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Level 3 - Leaves under Right's Inner -->
  <rect x="440" y="350" width="110" height="44" rx="8" fill="url(#leaf)" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="495" y="369" text-anchor="middle" fill="#f0fdfa" font-weight="bold">Leaf D (sp)</text>
  <text x="495" y="384" text-anchor="middle" fill="#a7f3d0" font-size="11">sphere #8</text>

  <rect x="570" y="350" width="110" height="44" rx="8" fill="url(#leaf)" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="625" y="369" text-anchor="middle" fill="#f0fdfa" font-weight="bold">Leaf E (tr)</text>
  <text x="625" y="384" text-anchor="middle" fill="#a7f3d0" font-size="11">triangle #2</text>

  <path d="M 505 304 C 505 327, 495 327, 495 350" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 585 304 C 585 327, 595 327, 595 350" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Bounding Volume Visualizations -->
  <text x="160" y="430" text-anchor="middle" fill="#94a3b8" font-size="11">Bounding Volume Shapes:</text>

  <!-- AABB icon -->
  <rect x="50" y="445" width="60" height="50" rx="4" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  <text x="80" y="476" text-anchor="middle" fill="#818cf8" font-size="10">AABB</text>

  <!-- Sphere icon -->
  <circle cx="210" cy="470" r="22" fill="none" stroke="#4ade80" stroke-width="1.5"/>
  <text x="210" y="476" text-anchor="middle" fill="#4ade80" font-size="10">Sphere</text>

  <!-- OBB icon -->
  <g transform="translate(320, 445) rotate(15)">
    <rect x="0" y="0" width="60" height="50" rx="4" fill="none" stroke="#c084fc" stroke-width="1.5"/>
  </g>
  <text x="370" y="476" text-anchor="middle" fill="#c084fc" font-size="10">OBB</text>

  <!-- Skip pointer diagram -->
  <text x="540" y="430" text-anchor="middle" fill="#94a3b8" font-size="11">Flat Array (DFS order):</text>
  <rect x="470" y="445" width="50" height="30" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="495" y="464" text-anchor="middle" fill="#c7d2fe" font-size="10">[0]</text>
  <rect x="525" y="445" width="50" height="30" rx="4" fill="#1b4332" stroke="#4ade80" stroke-width="1"/>
  <text x="550" y="464" text-anchor="middle" fill="#bbf7d0" font-size="10">[1]</text>
  <rect x="580" y="445" width="50" height="30" rx="4" fill="#134e4a" stroke="#2dd4bf" stroke-width="1"/>
  <text x="605" y="464" text-anchor="middle" fill="#a7f3d0" font-size="10">[2]</text>
  <rect x="635" y="445" width="50" height="30" rx="4" fill="#134e4a" stroke="#2dd4bf" stroke-width="1"/>
  <text x="660" y="464" text-anchor="middle" fill="#a7f3d0" font-size="10">[3]</text>
  <rect x="690" y="445" width="50" height="30" rx="4" fill="#4a1942" stroke="#c084fc" stroke-width="1"/>
  <text x="715" y="464" text-anchor="middle" fill="#e9d5ff" font-size="10">[4]</text>

  <text x="545" y="500" text-anchor="middle" fill="#94a3b8" font-size="10">skip[0] = 2 · skip[1] = 4 · skip[2] = 3 · skip[3] = 4 · skip[4] = -1</text>
</svg>