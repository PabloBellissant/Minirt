<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Layer background gradients -->
    <linearGradient id="binary-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="lib-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="asset-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#271c0a"/>
      <stop offset="100%" stop-color="#422b0e"/>
    </linearGradient>

    <!-- Sub-box gradients -->
    <linearGradient id="sub-binary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1527"/>
      <stop offset="100%" stop-color="#0f0b1a"/>
    </linearGradient>
    <linearGradient id="sub-lib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#031b0d"/>
    </linearGradient>
    <linearGradient id="sub-asset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e220a"/>
      <stop offset="100%" stop-color="#1a1306"/>
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#64748b"/>
    </marker>
    <marker id="arrow-asset" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#fbbf24"/>
    </marker>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2333" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="660" fill="url(#bg)" rx="12"/>
  <rect width="960" height="660" fill="url(#grid)" rx="12"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold" filter="url(#glow)">miniRT System Architecture Overview</text>
  <text x="480" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Three-layer system: binary → libraries → assets</text>

  <!-- ============================================================ -->
  <!-- ARROWS (drawn first, behind boxes)                          -->
  <!-- ============================================================ -->

  <!-- Binary → Library arrows -->
  <!-- Binary box bottom edges are at y=155, y=230 -->
  <!-- Library box top edges are at y=310 -->
  <!-- From main.c → libft -->
  <path d="M 185 230 C 185 270, 185 270, 185 310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- From parsing/ → mlx_wrapper -->
  <path d="M 480 230 C 480 270, 480 270, 480 310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- From calc/ → xcerrcal -->
  <path d="M 775 230 C 775 270, 775 270, 775 310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- From init/ → mlxui -->
  <path d="M 185 155 C 185 200, 185 200, 185 310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- From hooks/ → mlx_wrapper -->
  <path d="M 480 155 C 480 200, 480 200, 480 310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- From export_scene/ → font_renderer -->
  <path d="M 775 155 C 775 200, 775 200, 775 310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Binary → Asset arrows -->
  <!-- Binary → Assets drops down past library layer -->
  <path d="M 185 230 C 185 400, 100 400, 100 530" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-asset)" opacity="0.5"/>
  <path d="M 480 230 C 480 400, 332 400, 332 530" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-asset)" opacity="0.5"/>
  <path d="M 775 230 C 775 400, 560 400, 560 530" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-asset)" opacity="0.5"/>

  <!-- Library internal arrows -->
  <!-- libft → mlx_wrapper -->
  <path d="M 320 365 C 360 365, 412 365, 412 365" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)" opacity="0.4"/>
  <!-- mlx_wrapper → font_renderer -->
  <path d="M 615 365 C 650 365, 706 365, 706 365" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)" opacity="0.4"/>

  <!-- ============================================================ -->
  <!-- LAYER 1: miniRT Binary (src/)                               -->
  <!-- ============================================================ -->

  <!-- Binary container -->
  <rect x="20" y="65" width="920" height="180" rx="8" fill="url(#binary-bg)" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <rect x="20" y="65" width="920" height="3" rx="1" fill="#a78bfa"/>

  <text x="40" y="82" text-anchor="start" fill="#a78bfa" font-size="11" font-weight="bold">▸ miniRT Binary (src/)</text>
  <text x="920" y="82" text-anchor="end" fill="#6b21a8" font-size="9">Compiled to minirt executable</text>

  <!-- Row 1 of binary sub-boxes -->
  <!-- main.c -->
  <rect x="40" y="95" width="280" height="55" rx="6" fill="url(#sub-binary)" stroke="#a78bfa" stroke-width="1.2"/>
  <rect x="40" y="95" width="280" height="2" fill="#a78bfa" rx="1"/>
  <text x="180" y="117" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">main.c</text>
  <text x="180" y="134" text-anchor="middle" fill="#8b7aa8" font-size="9">Entry point, t_data init, render loop dispatch</text>

  <!-- parsing/ -->
  <rect x="340" y="95" width="280" height="55" rx="6" fill="url(#sub-binary)" stroke="#a78bfa" stroke-width="1.2"/>
  <rect x="340" y="95" width="280" height="2" fill="#a78bfa" rx="1"/>
  <text x="480" y="117" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">parsing/</text>
  <text x="480" y="134" text-anchor="middle" fill="#8b7aa8" font-size="9">rt_parser · fill_gpu_data · OBJ/MTL loader</text>

  <!-- calc/ -->
  <rect x="640" y="95" width="280" height="55" rx="6" fill="url(#sub-binary)" stroke="#a78bfa" stroke-width="1.2"/>
  <rect x="640" y="95" width="280" height="2" fill="#a78bfa" rx="1"/>
  <text x="780" y="117" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">calc/</text>
  <text x="780" y="134" text-anchor="middle" fill="#8b7aa8" font-size="9">BVH · renderers · OpenCL kernels</text>

  <!-- Row 2 of binary sub-boxes -->
  <!-- init/ -->
  <rect x="40" y="165" width="280" height="55" rx="6" fill="url(#sub-binary)" stroke="#a78bfa" stroke-width="1.2"/>
  <rect x="40" y="165" width="280" height="2" fill="#a78bfa" rx="1"/>
  <text x="180" y="187" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">init/</text>
  <text x="180" y="204" text-anchor="middle" fill="#8b7aa8" font-size="9">UI setup · graphics init · window creation</text>

  <!-- hooks/ -->
  <rect x="340" y="165" width="280" height="55" rx="6" fill="url(#sub-binary)" stroke="#a78bfa" stroke-width="1.2"/>
  <rect x="340" y="165" width="280" height="2" fill="#a78bfa" rx="1"/>
  <text x="480" y="187" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">hooks/</text>
  <text x="480" y="204" text-anchor="middle" fill="#8b7aa8" font-size="9">Keyboard · mouse · params · camera movement</text>

  <!-- export_scene/ -->
  <rect x="640" y="165" width="280" height="55" rx="6" fill="url(#sub-binary)" stroke="#a78bfa" stroke-width="1.2"/>
  <rect x="640" y="165" width="280" height="2" fill="#a78bfa" rx="1"/>
  <text x="780" y="187" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">export_scene/</text>
  <text x="780" y="204" text-anchor="middle" fill="#8b7aa8" font-size="9">Write modified .rt files from editor</text>

  <!-- ============================================================ -->
  <!-- LAYER 2: Library Submodules (lib/)                           -->
  <!-- ============================================================ -->

  <!-- Library container -->
  <rect x="20" y="285" width="920" height="180" rx="8" fill="url(#lib-bg)" stroke="#34d399" stroke-width="1.5" opacity="0.5"/>
  <rect x="20" y="285" width="920" height="3" rx="1" fill="#34d399"/>

  <text x="40" y="302" text-anchor="start" fill="#34d399" font-size="11" font-weight="bold">▸ Library Submodules (lib/)</text>
  <text x="920" y="302" text-anchor="end" fill="#065f46" font-size="9">Git submodules, compiled as static libraries</text>

  <!-- Row 1 of library sub-boxes -->
  <!-- libft -->
  <rect x="40" y="315" width="280" height="55" rx="6" fill="url(#sub-lib)" stroke="#34d399" stroke-width="1.2"/>
  <rect x="40" y="315" width="280" height="2" fill="#34d399" rx="1"/>
  <text x="180" y="337" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">libft</text>
  <text x="180" y="354" text-anchor="middle" fill="#5c8a72" font-size="9">Vectors · colors · matrices · utilities</text>

  <!-- mlx_wrapper -->
  <rect x="340" y="315" width="280" height="55" rx="6" fill="url(#sub-lib)" stroke="#34d399" stroke-width="1.2"/>
  <rect x="340" y="315" width="280" height="2" fill="#34d399" rx="1"/>
  <text x="480" y="337" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">mlx_wrapper</text>
  <text x="480" y="354" text-anchor="middle" fill="#5c8a72" font-size="9">Input abstraction · draw helpers · images</text>

  <!-- font_renderer -->
  <rect x="640" y="315" width="280" height="55" rx="6" fill="url(#sub-lib)" stroke="#34d399" stroke-width="1.2"/>
  <rect x="640" y="315" width="280" height="2" fill="#34d399" rx="1"/>
  <text x="780" y="337" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">font_renderer</text>
  <text x="780" y="354" text-anchor="middle" fill="#5c8a72" font-size="9">TTF parsing · glyph rasterization · atlas</text>

  <!-- Row 2 of library sub-boxes -->
  <!-- mlxui -->
  <rect x="40" y="385" width="280" height="55" rx="6" fill="url(#sub-lib)" stroke="#34d399" stroke-width="1.2"/>
  <rect x="40" y="385" width="280" height="2" fill="#34d399" rx="1"/>
  <text x="180" y="407" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">mlxui</text>
  <text x="180" y="424" text-anchor="middle" fill="#5c8a72" font-size="9">GUI component toolkit · scene list · edit panels</text>

  <!-- xcerrcal -->
  <rect x="340" y="385" width="280" height="55" rx="6" fill="url(#sub-lib)" stroke="#34d399" stroke-width="1.2"/>
  <rect x="340" y="385" width="280" height="2" fill="#34d399" rx="1"/>
  <text x="480" y="407" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">xcerrcal</text>
  <text x="480" y="424" text-anchor="middle" fill="#5c8a72" font-size="9">Error cascade framework · cleanup hooks</text>

  <!-- minilibx-linux -->
  <rect x="640" y="385" width="280" height="55" rx="6" fill="url(#sub-lib)" stroke="#34d399" stroke-width="1.2"/>
  <rect x="640" y="385" width="280" height="2" fill="#34d399" rx="1"/>
  <text x="780" y="407" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">minilibx-linux</text>
  <text x="780" y="424" text-anchor="middle" fill="#5c8a72" font-size="9">X11 windowing · image buffers · events</text>

  <!-- ============================================================ -->
  <!-- LAYER 3: Assets (minirt-assets/)                             -->
  <!-- ============================================================ -->

  <!-- Assets container -->
  <rect x="20" y="505" width="920" height="120" rx="8" fill="url(#asset-bg)" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  <rect x="20" y="505" width="920" height="3" rx="1" fill="#fbbf24"/>

  <text x="40" y="522" text-anchor="start" fill="#fbbf24" font-size="11" font-weight="bold">▸ Assets (minirt-assets/)</text>
  <text x="920" y="522" text-anchor="end" fill="#78350f" font-size="9">Git submodule, loaded at runtime</text>

  <!-- 4 asset sub-boxes -->
  <!-- .rt scenes -->
  <rect x="40" y="535" width="215" height="70" rx="6" fill="url(#sub-asset)" stroke="#fbbf24" stroke-width="1.2"/>
  <rect x="40" y="535" width="215" height="2" fill="#fbbf24" rx="1"/>
  <text x="147" y="558" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">.rt scenes</text>
  <text x="147" y="575" text-anchor="middle" fill="#a17d35" font-size="9">Camera + objects +</text>
  <text x="147" y="589" text-anchor="middle" fill="#a17d35" font-size="9">lights + materials</text>

  <!-- .obj meshes -->
  <rect x="255" y="535" width="215" height="70" rx="6" fill="url(#sub-asset)" stroke="#fbbf24" stroke-width="1.2"/>
  <rect x="255" y="535" width="215" height="2" fill="#fbbf24" rx="1"/>
  <text x="362" y="558" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">.obj meshes</text>
  <text x="362" y="575" text-anchor="middle" fill="#a17d35" font-size="9">Triangle geometry</text>
  <text x="362" y="589" text-anchor="middle" fill="#a17d35" font-size="9">with vertex normals</text>

  <!-- .mtl materials -->
  <rect x="470" y="535" width="215" height="70" rx="6" fill="url(#sub-asset)" stroke="#fbbf24" stroke-width="1.2"/>
  <rect x="470" y="535" width="215" height="2" fill="#fbbf24" rx="1"/>
  <text x="577" y="558" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">.mtl materials</text>
  <text x="577" y="575" text-anchor="middle" fill="#a17d35" font-size="9">PBR + Phong surface</text>
  <text x="577" y="589" text-anchor="middle" fill="#a17d35" font-size="9">parameter definitions</text>

  <!-- .ppm textures -->
  <rect x="685" y="535" width="215" height="70" rx="6" fill="url(#sub-asset)" stroke="#fbbf24" stroke-width="1.2"/>
  <rect x="685" y="535" width="215" height="2" fill="#fbbf24" rx="1"/>
  <text x="792" y="558" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">.ppm textures</text>
  <text x="792" y="575" text-anchor="middle" fill="#a17d35" font-size="9">Image texture maps</text>
  <text x="792" y="589" text-anchor="middle" fill="#a17d35" font-size="9">for surface detail</text>

  <!-- ============================================================ -->
  <!-- LEGEND                                                      -->
  <!-- ============================================================ -->
  <g transform="translate(570, 635)">
    <circle cx="0" cy="0" r="4" fill="#a78bfa" opacity="0.8"/>
    <text x="10" y="4" text-anchor="start" fill="#94a3b8" font-size="9">Binary</text>
    <circle cx="70" cy="0" r="4" fill="#34d399" opacity="0.8"/>
    <text x="80" y="4" text-anchor="start" fill="#94a3b8" font-size="9">Libraries</text>
    <circle cx="140" cy="0" r="4" fill="#fbbf24" opacity="0.8"/>
    <text x="150" y="4" text-anchor="start" fill="#94a3b8" font-size="9">Assets</text>
    <line x1="210" y1="0" x2="230" y2="0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
    <text x="240" y="4" text-anchor="start" fill="#94a3b8" font-size="9">Dependency</text>
    <line x1="315" y1="0" x2="335" y2="0" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-asset)" opacity="0.5"/>
    <text x="345" y="4" text-anchor="start" fill="#94a3b8" font-size="9">File I/O</text>
  </g>
</svg>