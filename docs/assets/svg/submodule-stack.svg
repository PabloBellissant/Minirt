<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" font-family="monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ours" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="ext" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="bin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>

  <rect width="720" height="510" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">miniRT Submodule Architecture</text>
  <text x="360" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">indigo = self-made / teal = external / green = binary</text>

  <!-- ===== ARROWS (drawn first, behind boxes) ===== -->

  <!-- libft (440,95) → xcerrcal (520,95) [horizontal, row 1] -->
  <path d="M 440 95 C 460 95, 500 95, 520 95" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 1 → Row 2 -->

  <!-- minilibx (130,120) → mlx_wrapper (130,175) -->
  <path d="M 130 120 C 130 147, 130 147, 130 175" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- minilibx (130,120) → font_renderer (360,175) -->
  <path d="M 130 120 C 130 140, 360 140, 360 175" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- libft (360,120) → mlx_wrapper (130,175) -->
  <path d="M 360 120 C 360 140, 130 140, 130 175" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- libft (360,120) → font_renderer (360,175) -->
  <path d="M 360 120 C 360 147, 360 147, 360 175" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- xcerrcal (600,120) → mlx_wrapper (130,175) -->
  <path d="M 600 120 C 600 140, 130 140, 130 175" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- xcerrcal (600,120) → font_renderer (360,175) -->
  <path d="M 600 120 C 600 140, 360 140, 360 175" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2 horizontal: mlx_wrapper (210,200) → font_renderer (280,200) -->
  <path d="M 210 200 C 230 200, 260 200, 280 200" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2 → Row 3 (mlxui) -->

  <!-- mlx_wrapper (130,225) → mlxui (290,310) -->
  <path d="M 130 225 C 130 260, 290 260, 290 310" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- font_renderer (360,225) → mlxui (290,310) -->
  <path d="M 360 225 C 360 260, 290 260, 290 310" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 1 → Row 3 (mlxui) -->

  <!-- minilibx (130,120) → mlxui (290,310) -->
  <path d="M 130 120 C 130 200, 290 200, 290 310" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- libft (360,120) → mlxui (290,310) -->
  <path d="M 360 120 C 360 200, 290 200, 290 310" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- xcerrcal (600,120) → mlxui (290,310) -->
  <path d="M 600 120 C 600 200, 290 200, 290 310" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 3 → Row 4 (miniRT) -->

  <!-- mlxui (290,360) → miniRT (360,440) -->
  <path d="M 290 360 C 290 400, 360 400, 360 440" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2 → Row 4 (miniRT) -->

  <!-- mlx_wrapper (130,225) → miniRT (360,440) -->
  <path d="M 130 225 C 130 330, 360 330, 360 440" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- font_renderer (360,225) → miniRT (360,440) -->
  <path d="M 360 225 C 360 332, 360 332, 360 440" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 1 → Row 4 (miniRT) -->

  <!-- minilibx (130,120) → miniRT (360,440) -->
  <path d="M 130 120 C 130 250, 360 250, 360 440" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- libft (360,120) → miniRT (360,440) -->
  <path d="M 360 120 C 360 280, 360 280, 360 440" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- xcerrcal (600,120) → miniRT (360,440) -->
  <path d="M 600 120 C 600 250, 360 250, 360 440" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== BOXES ===== -->

  <!-- Row 1: Foundation -->
  <rect x="50" y="70" width="160" height="50" rx="8" fill="url(#ext)" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="130" y="92" text-anchor="middle" fill="#f0fdfa" font-weight="bold">minilibx-linux</text>
  <text x="130" y="108" text-anchor="middle" fill="#a7f3d0" font-size="11">X11 windowing (not ours)</text>

  <rect x="280" y="70" width="160" height="50" rx="8" fill="url(#ours)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="360" y="92" text-anchor="middle" fill="#eef2ff" font-weight="bold">libft</text>
  <text x="360" y="108" text-anchor="middle" fill="#c7d2fe" font-size="11">vectors, colors, matrices</text>

  <rect x="520" y="70" width="160" height="50" rx="8" fill="url(#ours)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="600" y="92" text-anchor="middle" fill="#eef2ff" font-weight="bold">xcerrcal</text>
  <text x="600" y="108" text-anchor="middle" fill="#c7d2fe" font-size="11">error handling (all libs)</text>

  <!-- Row 2: Mid-level -->
  <rect x="50" y="175" width="160" height="50" rx="8" fill="url(#ours)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="130" y="197" text-anchor="middle" fill="#eef2ff" font-weight="bold">mlx_wrapper</text>
  <text x="130" y="213" text-anchor="middle" fill="#c7d2fe" font-size="11">input, key/mouse hooks</text>

  <rect x="280" y="175" width="160" height="50" rx="8" fill="url(#ours)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="360" y="197" text-anchor="middle" fill="#eef2ff" font-weight="bold">font_renderer</text>
  <text x="360" y="213" text-anchor="middle" fill="#c7d2fe" font-size="11">TTF parsing + rasterization</text>

  <!-- Row 3: High-level -->
  <rect x="210" y="310" width="160" height="50" rx="8" fill="url(#ours)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="290" y="332" text-anchor="middle" fill="#eef2ff" font-weight="bold">mlxui</text>
  <text x="290" y="348" text-anchor="middle" fill="#c7d2fe" font-size="11">GUI components, hierarchy</text>

  <!-- Row 4: Binary -->
  <rect x="230" y="440" width="260" height="50" rx="8" fill="url(#bin)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="360" y="463" text-anchor="middle" fill="#f0fdf4" font-weight="bold" font-size="14">miniRT binary</text>
  <text x="360" y="479" text-anchor="middle" fill="#bbf7d0" font-size="11">OpenCL ray tracing + UI + scene editor</text>
</svg>