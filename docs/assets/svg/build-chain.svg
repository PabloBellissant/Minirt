<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="610" viewBox="0 0 920 610" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Library sub-box gradient (green) -->
    <linearGradient id="sub-lib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#031b0d"/>
    </linearGradient>

    <!-- xcerrcal sub-box gradient (amber) -->
    <linearGradient id="sub-xcerr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e220a"/>
      <stop offset="100%" stop-color="#1a1306"/>
    </linearGradient>

    <!-- Binary sub-box gradient (purple) -->
    <linearGradient id="sub-binary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1527"/>
      <stop offset="100%" stop-color="#0f0b1a"/>
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#64748b"/>
    </marker>

    <!-- Reverse arrow marker (for bidirectional dependency start) -->
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <polygon points="10,0 0,5 10,10" fill="#64748b"/>
    </marker>

    <!-- Glow filter for title -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2333" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="920" height="610" fill="url(#bg)" rx="12"/>
  <rect width="920" height="610" fill="url(#grid)" rx="12"/>

  <!-- Title -->
  <text x="460" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold" filter="url(#glow)">miniRT Build Dependency Chain</text>
  <text x="460" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">Four-layer static library build — arrows show prerequisite dependencies (↓ depends-on ↑)</text>

  <!-- ============================================================ -->
  <!-- ARROWS (drawn behind boxes)                                  -->
  <!-- ============================================================ -->
  <!-- libft arrows connect to LEFT side of targets -->
  <!-- xcerrcal arrows connect to RIGHT side of targets -->
  <!-- minilibx-linux arrows connect to TOP/CENTER (unchanged) -->

  <!-- Bidirectional: libft ↔ xcerrcal (arcs above Layer 0) -->
  <path d="M 260 90 C 260 55, 660 55, 660 90" fill="none" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Layer 0 → Layer 1 (mlx_wrapper) -->
  <!-- libft → mlx_wrapper (left side) -->
  <path d="M 160 155 C 160 190, 280 190, 320 222" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- minilibx-linux → mlx_wrapper -->
  <path d="M 460 155 L 460 185" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- xcerrcal → mlx_wrapper (right side) -->
  <path d="M 760 155 C 760 190, 640 190, 600 222" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Layer 0 → Layer 2 (font_renderer) -->
  <!-- libft → font_renderer (left side) -->
  <path d="M 120 155 C 120 240, 280 240, 320 322" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- minilibx-linux → font_renderer -->
  <path d="M 460 155 C 460 220, 460 220, 460 285" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- xcerrcal → font_renderer (right side) -->
  <path d="M 800 155 C 800 240, 640 240, 600 322" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Layer 1 → Layer 2 (font_renderer) -->
  <!-- mlx_wrapper → font_renderer -->
  <path d="M 460 255 L 460 285" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Layer 0 → Layer 3 (mlxui) -->
  <!-- libft → mlxui (left side) -->
  <path d="M 80 155 C 80 340, 280 340, 320 422" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- minilibx-linux → mlxui -->
  <path d="M 460 155 C 460 270, 460 270, 460 385" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- xcerrcal → mlxui (right side) -->
  <path d="M 840 155 C 840 340, 640 340, 600 422" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Layer 1 → Layer 3 (mlxui) -->
  <!-- mlx_wrapper → mlxui -->
  <path d="M 460 255 C 460 320, 460 320, 460 385" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Layer 2 → Layer 3 (mlxui) -->
  <!-- font_renderer → mlxui -->
  <path d="M 460 355 L 460 385" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Layer 0 → Layer 4 (miniRT) -->
  <!-- libft → miniRT (left side) -->
  <path d="M 60 155 C 60 420, 250 420, 290 535" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- minilibx-linux → miniRT -->
  <path d="M 460 155 C 460 325, 460 325, 460 495" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- xcerrcal → miniRT (right side) -->
  <path d="M 860 155 C 860 420, 670 420, 630 535" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Layer 1 → Layer 4 (miniRT) -->
  <!-- mlx_wrapper → miniRT -->
  <path d="M 460 255 C 460 375, 460 375, 460 495" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Layer 2 → Layer 4 (miniRT) -->
  <!-- font_renderer → miniRT -->
  <path d="M 460 355 C 460 425, 460 425, 460 495" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Layer 3 → Layer 4 (miniRT) -->
  <!-- mlxui → miniRT -->
  <path d="M 460 455 L 460 495" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- ============================================================ -->
  <!-- LAYER LABELS (left margin badges)                            -->
  <!-- ============================================================ -->
  <g transform="translate(15, 0)">
    <!-- Layer 0 -->
    <rect x="0" y="95" width="18" height="70" rx="3" fill="#2d3748" opacity="0.6"/>
    <text x="9" y="115" text-anchor="middle" fill="#94a3b8" font-size="9" transform="rotate(-90, 9, 115)">L0</text>

    <!-- Layer 1 -->
    <rect x="0" y="200" width="18" height="65" rx="3" fill="#2d3748" opacity="0.6"/>
    <text x="9" y="218" text-anchor="middle" fill="#94a3b8" font-size="9" transform="rotate(-90, 9, 218)">L1</text>

    <!-- Layer 2 -->
    <rect x="0" y="300" width="18" height="65" rx="3" fill="#2d3748" opacity="0.6"/>
    <text x="9" y="318" text-anchor="middle" fill="#94a3b8" font-size="9" transform="rotate(-90, 9, 318)">L2</text>

    <!-- Layer 3 -->
    <rect x="0" y="400" width="18" height="65" rx="3" fill="#2d3748" opacity="0.6"/>
    <text x="9" y="418" text-anchor="middle" fill="#94a3b8" font-size="9" transform="rotate(-90, 9, 418)">L3</text>

    <!-- Layer 4 -->
    <rect x="0" y="515" width="18" height="70" rx="3" fill="#2d3748" opacity="0.6"/>
    <text x="9" y="540" text-anchor="middle" fill="#94a3b8" font-size="9" transform="rotate(-90, 9, 540)">L4</text>
  </g>

  <!-- ============================================================ -->
  <!-- LAYER 0: Foundation (no prerequisites, built in parallel)    -->
  <!-- ============================================================ -->
  <g transform="translate(0, 0)">
    <!-- libft -->
    <rect x="40" y="90" width="240" height="65" rx="6" fill="url(#sub-lib)" stroke="#34d399" stroke-width="1.2"/>
    <rect x="40" y="90" width="240" height="2" fill="#34d399" rx="1"/>
    <text x="160" y="113" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">libft</text>
    <text x="160" y="130" text-anchor="middle" fill="#5c8a72" font-size="10">libft.a</text>
    <text x="160" y="147" text-anchor="middle" fill="#4a6f5a" font-size="9">Vectors · colors · matrices · utilities</text>

    <!-- minilibx-linux -->
    <rect x="340" y="90" width="240" height="65" rx="6" fill="url(#sub-lib)" stroke="#34d399" stroke-width="1.2"/>
    <rect x="340" y="90" width="240" height="2" fill="#34d399" rx="1"/>
    <text x="460" y="113" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">minilibx-linux</text>
    <text x="460" y="130" text-anchor="middle" fill="#5c8a72" font-size="10">libmlx.a</text>
    <text x="460" y="147" text-anchor="middle" fill="#4a6f5a" font-size="9">X11 windowing · image buffers · events</text>

    <!-- xcerrcal (different accent - amber) -->
    <rect x="640" y="90" width="240" height="65" rx="6" fill="url(#sub-xcerr)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="640" y="90" width="240" height="2" fill="#f59e0b" rx="1"/>
    <text x="760" y="113" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">xcerrcal</text>
    <text x="760" y="130" text-anchor="middle" fill="#b8860b" font-size="10">libxcerrcal.a</text>
    <text x="760" y="147" text-anchor="middle" fill="#8a6d0b" font-size="9">Error cascade · cleanup hooks</text>
  </g>

  <!-- ============================================================ -->
  <!-- LAYER 1: mlx_wrapper (depends on minilibx-linux + libft)     -->
  <!-- ============================================================ -->
  <g transform="translate(0, 0)">
    <rect x="320" y="190" width="280" height="65" rx="6" fill="url(#sub-lib)" stroke="#34d399" stroke-width="1.2"/>
    <rect x="320" y="190" width="280" height="2" fill="#34d399" rx="1"/>
    <text x="460" y="212" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">mlx_wrapper</text>
    <text x="460" y="229" text-anchor="middle" fill="#5c8a72" font-size="10">libmlx-wrapper.a</text>
    <text x="460" y="247" text-anchor="middle" fill="#4a6f5a" font-size="9">Input abstraction · draw helpers · images</text>
  </g>

  <!-- ============================================================ -->
  <!-- LAYER 2: font_renderer (depends on mlx_wrapper + libft)      -->
  <!-- ============================================================ -->
  <g transform="translate(0, 0)">
    <rect x="320" y="290" width="280" height="65" rx="6" fill="url(#sub-lib)" stroke="#34d399" stroke-width="1.2"/>
    <rect x="320" y="290" width="280" height="2" fill="#34d399" rx="1"/>
    <text x="460" y="312" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">font_renderer</text>
    <text x="460" y="329" text-anchor="middle" fill="#5c8a72" font-size="10">libfont-renderer.a</text>
    <text x="460" y="347" text-anchor="middle" fill="#4a6f5a" font-size="9">TTF parsing · glyph rasterization · atlas</text>
  </g>

  <!-- ============================================================ -->
  <!-- LAYER 3: mlxui (depends on font_renderer + mlx_wrapper + ...)-->
  <!-- ============================================================ -->
  <g transform="translate(0, 0)">
    <rect x="320" y="390" width="280" height="65" rx="6" fill="url(#sub-lib)" stroke="#34d399" stroke-width="1.2"/>
    <rect x="320" y="390" width="280" height="2" fill="#34d399" rx="1"/>
    <text x="460" y="412" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">mlxui</text>
    <text x="460" y="429" text-anchor="middle" fill="#5c8a72" font-size="10">libmlxui.a</text>
    <text x="460" y="447" text-anchor="middle" fill="#4a6f5a" font-size="9">GUI component toolkit · scene list · edit panels</text>
  </g>

  <!-- ============================================================ -->
  <!-- LAYER 4: miniRT binary (depends on all libraries)            -->
  <!-- ============================================================ -->
  <g transform="translate(0, 0)">
    <rect x="290" y="500" width="340" height="70" rx="8" fill="url(#sub-binary)" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="290" y="500" width="340" height="3" fill="#a78bfa" rx="1"/>
    <text x="460" y="524" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="bold">miniRT</text>
    <text x="460" y="545" text-anchor="middle" fill="#8b7aa8" font-size="10">OpenCL ray tracer · scene editor · GUI</text>
    <text x="460" y="562" text-anchor="middle" fill="#6b5b88" font-size="9">Depends on: mlxui · font_renderer · mlx_wrapper · libft · minilibx-linux · xcerrcal</text>
  </g>

  <!-- ============================================================ -->
  <!-- LEGEND                                                       -->
  <!-- ============================================================ -->
  <g transform="translate(40, 575)">
    <rect x="0" y="-8" width="840" height="28" rx="4" fill="#161b22" opacity="0.7"/>
    <circle cx="16" cy="6" r="4" fill="#34d399" opacity="0.9"/>
    <text x="26" y="10" text-anchor="start" fill="#94a3b8" font-size="9">Library (.a)</text>
    <circle cx="106" cy="6" r="4" fill="#f59e0b" opacity="0.9"/>
    <text x="116" y="10" text-anchor="start" fill="#94a3b8" font-size="9">xcerrcal (shared)</text>
    <circle cx="270" cy="6" r="4" fill="#a78bfa" opacity="0.9"/>
    <text x="280" y="10" text-anchor="start" fill="#94a3b8" font-size="9">Binary</text>
    <line x1="350" y1="6" x2="380" y2="6" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
    <text x="394" y="10" text-anchor="start" fill="#94a3b8" font-size="9">Prerequisite dependency</text>
    <text x="600" y="10" text-anchor="start" fill="#4a5568" font-size="9">L0–L4 = build layers (bottom-up)</text>
  </g>
</svg>