<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="camera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a1942"/>
      <stop offset="100%" stop-color="#7b2d8b"/>
    </linearGradient>
    <linearGradient id="focal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="url(#bg)" rx="12"/>

  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">Thin Lens Camera Model &amp; Depth of Field</text>
  <text x="400" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">indigo = camera body / purple = lens aperture / green = focal plane</text>

  <!-- Camera body -->
  <rect x="30" y="160" width="100" height="120" rx="8" fill="url(#camera)" stroke="#818cf8" stroke-width="2"/>
  <text x="80" y="205" text-anchor="middle" fill="#eef2ff" font-weight="bold">Camera</text>
  <text x="80" y="222" text-anchor="middle" fill="#c7d2fe" font-size="11">pos (0,0,0)</text>
  <text x="80" y="239" text-anchor="middle" fill="#c7d2fe" font-size="11">viewport</text>
  <text x="80" y="256" text-anchor="middle" fill="#c7d2fe" font-size="11">FOV &theta;</text>

  <!-- Lens aperture -->
  <rect x="130" y="180" width="60" height="80" rx="6" fill="url(#lens)" stroke="#c084fc" stroke-width="2"/>
  <text x="160" y="205" text-anchor="middle" fill="#faf5ff" font-weight="bold">Lens</text>
  <text x="160" y="222" text-anchor="middle" fill="#e9d5ff" font-size="11">radius</text>
  <text x="160" y="239" text-anchor="middle" fill="#e9d5ff" font-size="11">= a</text>

  <line x1="130" y1="160" x2="130" y2="300" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="190" y1="160" x2="190" y2="300" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Focus distance label -->
  <line x1="160" y1="290" x2="500" y2="290" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="330" y="305" text-anchor="middle" fill="#4ade80" font-size="11">focus_dist (focal plane distance)</text>

  <!-- Focal plane -->
  <rect x="490" y="130" width="8" height="160" rx="2" fill="url(#focal)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="525" y="155" text-anchor="middle" fill="#bbf7d0" font-size="11">Focal Plane</text>
  <text x="525" y="172" text-anchor="middle" fill="#bbf7d0" font-size="11">(in focus)</text>

  <!-- Disk sampling illustration -->
  <text x="400" y="370" text-anchor="middle" fill="#94a3b8" font-size="11">Disk Sampling (lens aperture):</text>

  <!-- Lens disk -->
  <circle cx="400" cy="420" r="50" fill="none" stroke="#c084fc" stroke-width="1.5"/>
  <text x="400" y="400" text-anchor="middle" fill="#e9d5ff" font-size="10">Lens disk</text>

  <!-- Sample points -->
  <circle cx="370" cy="400" r="3" fill="#818cf8"/>
  <circle cx="420" cy="410" r="3" fill="#818cf8"/>
  <circle cx="390" cy="435" r="3" fill="#818cf8"/>
  <circle cx="410" cy="390" r="3" fill="#818cf8"/>
  <circle cx="385" cy="415" r="3" fill="#818cf8"/>
  <circle cx="415" cy="430" r="3" fill="#818cf8"/>

  <!-- Ray diagram -->
  <line x1="130" y1="200" x2="500" y2="200" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="240" x2="500" y2="180" stroke="#818cf8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="130" y1="220" x2="500" y2="220" stroke="#818cf8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Out of focus objects illustration -->
  <rect x="610" y="120" width="80" height="50" rx="4" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="650" y="145" text-anchor="middle" fill="#fca5a5" font-size="10">Near object</text>
  <text x="650" y="160" text-anchor="middle" fill="#fca5a5" font-size="10">(out of focus)</text>

  <rect x="610" y="220" width="80" height="50" rx="4" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="650" y="245" text-anchor="middle" fill="#fca5a5" font-size="10">Far object</text>
  <text x="650" y="260" text-anchor="middle" fill="#fca5a5" font-size="10">(out of focus)</text>

  <line x1="498" y1="200" x2="610" y2="145" stroke="#f87171" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="498" y1="200" x2="610" y2="245" stroke="#f87171" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- DOF formula -->
  <text x="650" y="340" text-anchor="middle" fill="#94a3b8" font-size="11">Depth of Field Formula:</text>
  <text x="650" y="360" text-anchor="middle" fill="#e2e8f0" font-size="12">ray = focal_point - lens_sample</text>
  <text x="650" y="378" text-anchor="middle" fill="#c7d2fe" font-size="11">focal_point = pos + dir &times; focus_dist</text>
  <text x="650" y="396" text-anchor="middle" fill="#c7d2fe" font-size="11">lens_sample = pos + disk_offset</text>
</svg>