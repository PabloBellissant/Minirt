<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bvh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a1942"/>
      <stop offset="100%" stop-color="#7b2d8b"/>
    </linearGradient>
    <linearGradient id="accu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="display" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="url(#bg)" rx="12"/>

  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">miniRT Render Pipeline</text>
  <text x="400" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">indigo = scene / green = BVH / purple = GPU / teal = accu / blue = display</text>

  <!-- Scene Parsing -->
  <rect x="60" y="80" width="180" height="60" rx="8" fill="url(#scene)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="150" y="103" text-anchor="middle" fill="#eef2ff" font-weight="bold">Scene Parsing</text>
  <text x="150" y="120" text-anchor="middle" fill="#c7d2fe" font-size="11">.rt file &rarr; t_scene</text>
  <text x="150" y="134" text-anchor="middle" fill="#c7d2fe" font-size="11">OBJ + MTL loading</text>

  <!-- BVH Build -->
  <rect x="310" y="80" width="180" height="60" rx="8" fill="url(#bvh)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="400" y="103" text-anchor="middle" fill="#f0fdfa" font-weight="bold">BVH Construction</text>
  <text x="400" y="120" text-anchor="middle" fill="#bbf7d0" font-size="11">AABB / Sphere / OBB</text>
  <text x="400" y="134" text-anchor="middle" fill="#bbf7d0" font-size="11">SAH / MedPrim / MedSpace</text>

  <!-- GPU Buffers -->
  <rect x="560" y="80" width="180" height="60" rx="8" fill="url(#gpu)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="650" y="103" text-anchor="middle" fill="#faf5ff" font-weight="bold">GPU Buffer Upload</text>
  <text x="650" y="120" text-anchor="middle" fill="#e9d5ff" font-size="11">clCreateBuffer</text>
  <text x="650" y="134" text-anchor="middle" fill="#e9d5ff" font-size="11">clEnqueueWriteBuffer</text>

  <!-- Arrows row 1 -->
  <line x1="240" y1="110" x2="310" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="110" x2="560" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- GPU Render Kernels -->
  <rect x="310" y="200" width="180" height="70" rx="8" fill="url(#gpu)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="400" y="222" text-anchor="middle" fill="#faf5ff" font-weight="bold">GPU Render Kernels</text>
  <text x="400" y="239" text-anchor="middle" fill="#e9d5ff" font-size="11">Phong / PBR / Monte Carlo</text>
  <text x="400" y="253" text-anchor="middle" fill="#e9d5ff" font-size="11">Normal Debug / Heat Map</text>

  <line x1="650" y1="140" x2="650" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="170" x2="400" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Accumulation Buffer -->
  <rect x="310" y="320" width="180" height="60" rx="8" fill="url(#accu)" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="400" y="343" text-anchor="middle" fill="#f0fdfa" font-weight="bold">Accumulation Buffer</text>
  <text x="400" y="360" text-anchor="middle" fill="#a7f3d0" font-size="11">float3 accu per pixel</text>
  <text x="400" y="374" text-anchor="middle" fill="#a7f3d0" font-size="11">progressive averaging</text>

  <line x1="400" y1="270" x2="400" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Display -->
  <rect x="310" y="430" width="180" height="60" rx="8" fill="url(#display)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="400" y="453" text-anchor="middle" fill="#eef2ff" font-weight="bold">Display Output</text>
  <text x="400" y="470" text-anchor="middle" fill="#c7d2fe" font-size="11">clEnqueueReadBuffer</text>
  <text x="400" y="484" text-anchor="middle" fill="#c7d2fe" font-size="11">mlx_put_image_to_window</text>

  <line x1="400" y1="380" x2="400" y2="430" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- UI Overlay -->
  <rect x="80" y="430" width="160" height="60" rx="8" fill="url(#scene)" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="160" y="453" text-anchor="middle" fill="#eef2ff" font-weight="bold">UI Overlay</text>
  <text x="160" y="470" text-anchor="middle" fill="#c7d2fe" font-size="11">mlxui hierarchy</text>
  <text x="160" y="484" text-anchor="middle" fill="#c7d2fe" font-size="11">edit panels + FPS</text>

  <line x1="240" y1="460" x2="310" y2="460" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
</svg>